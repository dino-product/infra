# Argo CD가 infra 레포(private)를 읽는 배포 키: Parameter Store → Argo CD 레포 Secret
# 키는 terraform/envs/dev/argocd.tf가 만들고, 공개 키는 레포 Deploy keys에 읽기 전용으로 등록돼 있다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: repo-infra, namespace: argocd }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: /orbit/dev/ARGOCD_REPO_SSH_KEY }
  target:
    name: repo-infra
    template:
      metadata:
        labels: { argocd.argoproj.io/secret-type: repository }
      data:
        type: git
        url: git@github.com:dino-product/infra.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
