# kubelet(cAdvisor) · etcd 지표 수집 대상. 전에는 kube-prometheus-stack의 operator가 만들던 Service · Endpoints · ServiceMonitor를 직접 둔다
# 노드가 바뀌어 사설 IP가 바뀌면 여기 IP 두 곳을 고친다 (terraform envs/dev/main.tf private_ip)
# Endpoints를 직접 두면 컨트롤 플레인이 EndpointSlice로 비춰 준다 (Alloy는 EndpointSlice로 찾는다)
apiVersion: v1
kind: Service
metadata:
  name: kubelet
  namespace: kube-system
  labels: { app.kubernetes.io/name: kubelet, k8s-app: kubelet }
spec:
  clusterIP: None
  ports:
    - { name: https-metrics, port: 10250, targetPort: 10250 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kubelet
  namespace: kube-system
  labels: { app.kubernetes.io/name: kubelet, k8s-app: kubelet }
subsets:
  - addresses: [{ ip: 10.10.0.10 }]
    ports:
      - { name: https-metrics, port: 10250 }
---
# 컨테이너 지표(cAdvisor)만. kubelet 자체 지표(/metrics)는 양이 많아 쓰지 않는다
# 인증은 Alloy 서비스 계정 토큰(platform/alloy-token.yaml). 안 쓰는 cAdvisor 지표는 긁은 뒤 버린다 (kube-prometheus-stack 기본 규칙과 같다)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet
  namespace: monitoring
spec:
  jobLabel: k8s-app
  namespaceSelector: { matchNames: [kube-system] }
  selector: { matchLabels: { k8s-app: kubelet } }
  endpoints:
    - port: https-metrics
      scheme: https
      path: /metrics/cadvisor
      interval: 60s
      honorLabels: true
      honorTimestamps: true
      trackTimestampsStaleness: true
      tlsConfig: { insecureSkipVerify: true }
      authorization:
        type: Bearer
        credentials: { name: alloy-token, key: token }
      relabelings:
        - { action: replace, sourceLabels: [__metrics_path__], targetLabel: metrics_path }
      metricRelabelings:
        - { action: drop, sourceLabels: [__name__], regex: "container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)" }
        - { action: drop, sourceLabels: [__name__], regex: "container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)" }
        - { action: drop, sourceLabels: [__name__], regex: "container_memory_(mapped_file|swap)" }
        - { action: drop, sourceLabels: [__name__], regex: "container_(file_descriptors|tasks_state|threads_max)" }
        - { action: drop, sourceLabels: [__name__, scope], regex: "container_memory_failures_total;hierarchy" }
        - { action: drop, sourceLabels: [__name__, interface], regex: "container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*" }
        - { action: drop, sourceLabels: [__name__], regex: "container_spec.*" }
        - { action: drop, sourceLabels: [id, pod], regex: ".+;" }
---
# k3s 내장 etcd. install-k3s.sh의 etcd-expose-metrics로 :2381(인증 없는 http)에 연다
apiVersion: v1
kind: Service
metadata:
  name: kube-etcd
  namespace: kube-system
  labels: { app.kubernetes.io/name: kube-etcd, jobLabel: kube-etcd }
spec:
  clusterIP: None
  ports:
    - { name: http-metrics, port: 2381, targetPort: 2381 }
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-etcd
  namespace: kube-system
  labels: { app.kubernetes.io/name: kube-etcd }
subsets:
  - addresses: [{ ip: 10.10.0.10 }]
    ports:
      - { name: http-metrics, port: 2381 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-etcd
  namespace: monitoring
spec:
  jobLabel: jobLabel
  namespaceSelector: { matchNames: [kube-system] }
  selector: { matchLabels: { app.kubernetes.io/name: kube-etcd } }
  endpoints:
    - port: http-metrics
      interval: 60s
