# Grafana Alloy (chart 1.14.0). 로그 · 지표를 모두 Grafana Cloud로 보낸다 (클러스터 안 Prometheus · Loki 없음)
# 로그: Kubernetes API로 Pod 로그를 읽는다 → DaemonSet · hostPath 불필요 (12-3)
# 지표: ServiceMonitor(exporter 차트 · 앱 차트)를 따라 긁고, kubelet · etcd는 노드를 찾아 직접 긁는다
controller: { type: deployment, replicas: 1 }
configReloader:
  resources: { requests: { memory: 32Mi }, limits: { memory: 64Mi } }
alloy:
  # 원격 쓰기 WAL만큼 늘었다 (보내는 지표는 아래 keep 규칙으로 수천 개)
  resources: { requests: { memory: 128Mi }, limits: { memory: 384Mi } }
  # GRAFANA_CLOUD_* (platform/grafana-cloud-secret.yaml)
  envFrom:
    - secretRef: { name: grafana-cloud }
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Pod 메타데이터를 Loki 라벨로 (라벨 수를 적게 유지: namespace · pod · container · app)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // 시스템 · 수집기 자신의 로그는 보내지 않는다 (Loki 무료 한도 · Alloy 메모리). 문제가 생기면 kubectl logs로 본다
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "kube-system|monitoring"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // kubelet API로 로그를 읽는다 → 노드 파일(hostPath) 마운트 불필요
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.mask.receiver]
      }

      // 로그는 국외(도쿄)에 저장된다 → 보내기 전에 개인정보 · 자격 증명을 가린다 (괄호 안만 바뀐다)
      // 앱은 이런 값을 남기지 않게 짜여 있고, 이건 실수 대비. Argo CD · dex 로그에는 로그인 이메일이 찍힌다
      // git@github.com 같은 SSH 주소도 <email>로 가려진다 (RE2라 예외를 둘 수 없다)
      loki.process "mask" {
        forward_to = [loki.write.cloud.receiver]

        stage.replace {
          expression = `([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})`
          replace    = "<email>"
        }
        stage.replace {
          expression = `\b(01[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4})\b`
          replace    = "<phone>"
        }
        stage.replace {
          expression = `(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*)`
          replace    = "<jwt>"
        }
        stage.replace {
          expression = `(?i)bearer\s+([A-Za-z0-9._~+/=-]+)`
          replace    = "<token>"
        }
      }

      loki.write "cloud" {
        endpoint {
          url = sys.env("GRAFANA_CLOUD_LOKI_URL")
          basic_auth {
            username = sys.env("GRAFANA_CLOUD_LOKI_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
        external_labels = { cluster = "orbit-dev", env = "dev" }
      }

      // kubelet(cAdvisor) · k3s 내장 etcd: 노드를 API에서 찾아 직접 긁는다 (job 라벨 kubelet · kube-etcd는 전과 같다)
      // ServiceMonitor로 하려면 Endpoints를 손으로 둬야 하는데 Argo CD가 Endpoints 종류를 기본으로 무시한다 → 여기서 처리
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // 컨테이너 지표만. kubelet 자체 지표(/metrics)는 양이 많아 쓰지 않는다. 인증은 Alloy 서비스 계정 토큰 (ClusterRole에 nodes/metrics)
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          target_label = "__metrics_path__"
          replacement  = "/metrics/cadvisor"
        }
        rule {
          target_label = "metrics_path"
          replacement  = "/metrics/cadvisor"
        }
      }

      prometheus.scrape "kubelet" {
        targets           = discovery.relabel.kubelet.output
        forward_to        = [prometheus.relabel.cadvisor.receiver]
        job_name          = "kubelet"
        scheme            = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        scrape_interval   = "60s"
        honor_labels      = true
        tls_config {
          insecure_skip_verify = true
        }
      }

      // 안 쓰는 cAdvisor 지표는 버린다 (kube-prometheus-stack 기본 규칙과 같다)
      prometheus.relabel "cadvisor" {
        forward_to = [prometheus.relabel.keep.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)|container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)|container_memory_(mapped_file|swap)|container_(file_descriptors|tasks_state|threads_max)|container_spec.*"
          action        = "drop"
        }
        rule {
          source_labels = ["__name__", "scope"]
          separator     = ";"
          regex         = "container_memory_failures_total;hierarchy"
          action        = "drop"
        }
        rule {
          source_labels = ["id", "pod"]
          separator     = ";"
          regex         = ".+;"
          action        = "drop"
        }
      }

      // etcd 지표는 install-k3s.sh의 etcd-expose-metrics로 노드 :2381(인증 없는 http)에 열려 있다
      discovery.relabel "etcd" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          target_label  = "__address__"
          replacement   = "$1:2381"
        }
      }

      prometheus.scrape "etcd" {
        targets         = discovery.relabel.etcd.output
        forward_to      = [prometheus.relabel.keep.receiver]
        job_name        = "kube-etcd"
        scrape_interval = "60s"
      }

      // exporter 차트 · 앱 차트의 ServiceMonitor를 그대로 따른다 (job 라벨도 Prometheus와 같다)
      // 무료 한도가 시계열 1만 개 · 분당 1회 기준이라 간격 60초 (ServiceMonitor에 간격이 있으면 그 값)
      prometheus.operator.servicemonitors "all" {
        forward_to = [prometheus.relabel.keep.receiver]
        scrape {
          default_scrape_interval = "60s"
        }
      }

      // 보낼 지표만 남긴다: 앱(orbit-server)은 전부, 나머지는 알림 · 기본 대시보드에 쓰는 것만
      // 큰 대상(apiserver 5만 · kubelet 자체 지표 6만)은 ServiceMonitor를 두지 않는다 (kubelet은 cAdvisor만)
      prometheus.relabel "keep" {
        forward_to = [prometheus.remote_write.cloud.receiver]

        rule {
          source_labels = ["job", "__name__"]
          separator     = ";"
          action        = "keep"
          regex         = "orbit-server;.*|[^;]*;(up|node_memory_(MemAvailable|MemTotal|SwapTotal|SwapFree)_bytes|node_filesystem_(avail|size)_bytes|node_cpu_seconds_total|node_load(1|5|15)|node_network_(receive|transmit)_bytes_total|node_disk_(read|written)_bytes_total|node_disk_io_time_seconds_total|node_vmstat_oom_kill|node_pressure_(cpu|memory|io)_waiting_seconds_total|kube_pod_status_phase|kube_pod_container_status_(restarts_total|waiting_reason|last_terminated_reason|ready)|kube_pod_container_resource_(requests|limits)|kube_deployment_(spec_replicas|status_replicas_available)|kube_statefulset_status_replicas_ready|kube_node_status_(allocatable|capacity|condition)|container_cpu_usage_seconds_total|container_memory_(working_set_bytes|rss)|container_network_(receive|transmit)_bytes_total|kubelet_volume_stats_(available|capacity)_bytes|etcd_mvcc_db_total_size_in_bytes|etcd_server_has_leader|argocd_app_info)"
        }
      }

      prometheus.remote_write "cloud" {
        endpoint {
          url = sys.env("GRAFANA_CLOUD_PROM_URL")
          basic_auth {
            username = sys.env("GRAFANA_CLOUD_PROM_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
        external_labels = { cluster = "orbit-dev", env = "dev" }
      }
