# dev 공개 주소 라우트: CloudFront → 노드(Traefik). Host와 CloudFront가 붙이는 비밀 헤더가 둘 다 맞아야 라우팅한다 (아니면 Traefik 404)
# 비밀 헤더 값이 들어가서 Git(Argo CD)으로 관리하지 않는다. ${ORIGIN_VERIFY} 자리를 채워 적용: scripts/apply-edge.sh dev
# CloudFront 배포: terraform/envs/dev/edge.tf (dev-api) · argocd-edge.tf (argocd)

# dev-api.orbi-t.com → orbit-server:8080. 미들웨어 forwarded-https는 앱 차트(ingressroute.yaml)에 있다
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: orbit-server, namespace: orbit-dev }
spec:
  entryPoints: [web]
  routes:
    - match: Host(`dev-api.orbi-t.com`) && Header(`X-Origin-Verify`, `${ORIGIN_VERIFY}`)
      kind: Rule
      middlewares: [{ name: forwarded-https }]
      services: [{ name: orbit-server, port: 8080 }]
---
# argocd.dev.orbi-t.com → argocd-server:80 (server.insecure: 원본 구간 HTTP)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forwarded-https, namespace: argocd }
spec:
  headers:
    customRequestHeaders: { X-Forwarded-Proto: https }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: argocd, namespace: argocd }
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.dev.orbi-t.com`) && Header(`X-Origin-Verify`, `${ORIGIN_VERIFY}`)
      kind: Rule
      middlewares: [{ name: forwarded-https }]
      services: [{ name: argocd-server, port: 80 }]
