# kube-prometheus-stack (chart 92.10.1). 메모리 4GB 노드라 Alertmanager를 끄고(알림은 Grafana) 한도를 건다 (12-2)
alertmanager: { enabled: false }
# k3s는 controller-manager · scheduler · kube-proxy를 한 프로세스로 묶고 127.0.0.1에만 열어서 긁지 않는다
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd:
  enabled: true
  endpoints: [10.10.0.10]                   # 노드 사설 IP. install-k3s.sh의 etcd-expose-metrics
  service: { enabled: true, port: 2381, targetPort: 2381 }

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB                      # PVC 10Gi보다 작게. 먼저 닿는 쪽에서 오래된 블록을 지운다
    scrapeInterval: 30s
    # 이 릴리스 라벨이 없는 ServiceMonitor · PodMonitor · PrometheusRule도 읽는다 (앱 차트 12-4)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources: { requests: { cpu: 100m, memory: 400Mi }, limits: { memory: 700Mi } }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 10Gi } }

grafana:
  admin: { existingSecret: grafana-admin }  # platform/grafana-secret.yaml
  defaultDashboardsTimezone: browser
  # Alertmanager를 껐으니 자동으로 붙는 Alertmanager 데이터 소스도 뺀다 (없으면 Grafana에 연결 오류로 남는다)
  # 대시보드 · 데이터 소스 사이드카 2개(각 80~90Mi 실측)에도 한도를 건다
  sidecar:
    datasources: { alertmanager: { enabled: false } }
    resources: { requests: { memory: 64Mi }, limits: { memory: 128Mi } }
  persistence: { enabled: true, storageClassName: local-path, size: 2Gi }
  # 실측 245Mi(설치 직후). 256Mi 한도면 OOMKilled 위험이라 384Mi
  resources: { requests: { memory: 192Mi }, limits: { memory: 384Mi } }
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100  # 12-3
    # 노드 역할로 인증(IMDS 홉 제한 2). envs/dev cw_read
    - name: CloudWatch
      type: cloudwatch
      jsonData: { authType: default, defaultRegion: ap-northeast-2 }

prometheusOperator:
  resources: { requests: { memory: 64Mi }, limits: { memory: 128Mi } }
kube-state-metrics:
  resources: { requests: { memory: 48Mi }, limits: { memory: 96Mi } }
prometheus-node-exporter:
  resources: { requests: { memory: 24Mi }, limits: { memory: 48Mi } }
