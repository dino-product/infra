# kube-prometheus-stack (chart 92.10.1). 지표 저장 · 화면 · 알림은 Grafana Cloud로 옮겼다
# 여기서는 내보내기(exporter)와 ServiceMonitor만 남긴다 → Alloy가 ServiceMonitor를 따라 긁어 보낸다 (alloy-values.yaml)
# CRD(ServiceMonitor 등)는 그대로 설치된다: 앱 차트의 servicemonitor.yaml이 쓴다
alertmanager: { enabled: false }
grafana: { enabled: false }
prometheus: { enabled: false }
prometheusOperator: { enabled: false }
defaultRules: { create: false }

# 수집하지 않는 대상은 ServiceMonitor도 만들지 않는다
# k3s는 controller-manager · scheduler · kube-proxy를 한 프로세스로 묶고 127.0.0.1에만 연다
kubeApiServer: { enabled: false }
coreDns: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

kubeEtcd:
  enabled: true
  endpoints: [10.10.0.10]                   # 노드 사설 IP. install-k3s.sh의 etcd-expose-metrics
  service: { enabled: true, port: 2381, targetPort: 2381 }
  serviceMonitor: { authorization: null }   # 2381은 인증 없는 http

# 컨테이너 지표(cAdvisor)만. kubelet 자체 지표(/metrics · /metrics/probes)는 쓰지 않는다
# 기본 인증 Secret은 Prometheus가 있어야 생긴다 → Alloy 서비스 계정 토큰(platform/alloy-token.yaml)으로 긁는다
# kubelet Service · Endpoints(kube-system)는 operator가 만들어 둔 것이 남아 있다. 노드가 바뀌면 직접 고친다
kubelet:
  serviceMonitor:
    kubelet: false
    probes: false
    cAdvisorInterval: 60s                   # 기본 10초 → Grafana Cloud 무료 한도(분당 1회) 기준
    authorization:
      type: Bearer
      credentials: { name: alloy-token, key: token }

kube-state-metrics:
  resources: { requests: { memory: 48Mi }, limits: { memory: 96Mi } }
prometheus-node-exporter:
  resources: { requests: { memory: 24Mi }, limits: { memory: 48Mi } }
