# prometheus-node-exporter (chart 4.60.1). job 라벨은 Service 라벨 jobLabel의 값 → 전(kube-prometheus-stack)과 같은 "node-exporter"
service:
  labels: { jobLabel: node-exporter }
prometheus:
  monitor:
    enabled: true
    jobLabel: jobLabel
    interval: 60s   # Grafana Cloud 무료 한도(분당 1회)
resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 48Mi } }
