# prometheus-node-exporter (chart 4.60.1). job 라벨은 Service의 jobLabel(node-exporter) → 알림 · Alloy keep 규칙과 같다
prometheus:
  monitor:
    enabled: true
    jobLabel: jobLabel
    interval: 60s   # Grafana Cloud 무료 한도(분당 1회)
resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 48Mi } }
