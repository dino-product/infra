# Grafana 공개 주소 grafana.dev.orbi-t.com → kps-grafana:80 (12단계). 앱 차트 ingressroute.yaml과 같은 방식
# CloudFront 배포는 terraform/envs/dev/grafana-edge.tf
# 비밀 헤더 값은 파일에 적지 않는다. ${ORIGIN_VERIFY} 자리를 적용할 때만 채운다:
#   OV=$(aws ssm get-parameter --with-decryption --name /orbit/dev/ORIGIN_VERIFY --query Parameter.Value --output text)
#   sed "s|\${ORIGIN_VERIFY}|$OV|" platform/grafana-ingressroute.yaml | kubectl apply -f -
# 원본 구간이 HTTP라 X-Forwarded-Proto를 https로 덮어쓴다 (Grafana가 리다이렉트 · 쿠키를 https 기준으로)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forwarded-https, namespace: monitoring }
spec:
  headers:
    customRequestHeaders: { X-Forwarded-Proto: https }
---
# Host와 CloudFront가 붙이는 비밀 헤더가 둘 다 맞아야 라우팅한다 (아니면 Traefik 404)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: grafana, namespace: monitoring }
spec:
  entryPoints: [web]
  routes:
    - match: Host(`grafana.dev.orbi-t.com`) && Header(`X-Origin-Verify`, `${ORIGIN_VERIFY}`)
      kind: Rule
      middlewares: [{ name: forwarded-https }]
      services: [{ name: kps-grafana, port: 80 }]
