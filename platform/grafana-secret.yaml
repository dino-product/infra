# Grafana 관리자 계정: Parameter Store → Secret grafana-admin (12-1)
# kube-prometheus-stack의 grafana.admin.existingSecret이 이 Secret의 admin-user · admin-password 키를 읽는다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-admin, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  data:
    - secretKey: adminPassword
      remoteRef: { key: /orbit/dev/GRAFANA_ADMIN_PASSWORD }
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
