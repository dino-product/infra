# Grafana 관리자 계정: Parameter Store → Secret grafana-admin (12-1)
# kube-prometheus-stack의 grafana.admin.existingSecret이 이 Secret의 admin-user · admin-password 키를 읽는다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-admin, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  data:
    - secretKey: adminPassword
      remoteRef: { key: /orbit/dev/GRAFANA_ADMIN_PASSWORD }
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .adminPassword }}"
---
# Grafana 알림 연락처의 Slack 웹훅 URL → 환경 변수 SLACK_WEBHOOK_URL (grafana-alerting.yaml의 envFromSecrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-alerting, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef: { key: /orbit/dev/SLACK_WEBHOOK_URL }
  target: { name: grafana-alerting }
