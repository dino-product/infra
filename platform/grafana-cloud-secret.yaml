# Grafana Cloud 전송 정보: Parameter Store → Secret grafana-cloud → Alloy 환경 변수 (alloy-values.yaml envFrom)
# 값은 terraform/shared/grafana-cloud.tf가 만든다 (토큰은 스택 dino 지표 · 로그 쓰기 전용)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-cloud, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  data:
    - secretKey: GRAFANA_CLOUD_TOKEN
      remoteRef: { key: /orbit/dev/GRAFANA_CLOUD_TOKEN }
    - secretKey: GRAFANA_CLOUD_PROM_URL
      remoteRef: { key: /orbit/dev/GRAFANA_CLOUD_PROM_URL }
    - secretKey: GRAFANA_CLOUD_PROM_USER
      remoteRef: { key: /orbit/dev/GRAFANA_CLOUD_PROM_USER }
    - secretKey: GRAFANA_CLOUD_LOKI_URL
      remoteRef: { key: /orbit/dev/GRAFANA_CLOUD_LOKI_URL }
    - secretKey: GRAFANA_CLOUD_LOKI_USER
      remoteRef: { key: /orbit/dev/GRAFANA_CLOUD_LOKI_USER }
  target: { name: grafana-cloud }
