# Loki (chart 7.3.0) 단일 바이너리 · 노드 디스크(local-path). 보존 7일 (12-3)
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config: { retention_period: 168h }
  compactor: { retention_enabled: true, delete_request_store: filesystem }
singleBinary:
  replicas: 1
  persistence: { enabled: true, storageClass: local-path, size: 10Gi }
  resources: { requests: { memory: 256Mi }, limits: { memory: 512Mi } }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }# Loki 알림 규칙을 쓰지 않으므로 규칙 사이드카(약 80Mi)를 끈다
sidecar: { rules: { enabled: false } }
