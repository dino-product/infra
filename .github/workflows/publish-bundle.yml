# 배포 번들 게시 (11-4): main에 차트 · 스크립트가 바뀌면 S3에 묶어 올린다
# 노드의 deploy.sh는 항상 bundle/latest.tgz를 받아 쓴다. <커밋 SHA>.tgz는 차트를 되돌릴 때 쓴다
name: publish-bundle
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "scripts/**"
      - "platform/**"
      - ".github/workflows/publish-bundle.yml"
  workflow_dispatch:
permissions: { id-token: write, contents: read }
concurrency: { group: publish-bundle, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUCKET: orbit-deploy-714047901967
    steps:
      - uses: actions/checkout@v4
      # 깨진 번들이 latest로 올라가면 다음 배포가 전부 실패하므로 먼저 검사한다
      - name: 검사
        run: |
          bash -n scripts/*.sh
          helm lint charts/orbit-server -f charts/orbit-server/values-dev.yaml \
            --set image.tag=0000000 --set-string originVerify=x
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714047901967:role/gh-infra-publish
          aws-region: ap-northeast-2
      - name: 번들 업로드
        run: |
          tar czf bundle.tgz charts scripts platform
          aws s3 cp bundle.tgz "s3://${BUCKET}/bundle/${GITHUB_SHA}.tgz"
          aws s3 cp bundle.tgz "s3://${BUCKET}/bundle/latest.tgz"
          echo "published ${GITHUB_SHA} ($(du -h bundle.tgz | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
