# dev 클러스터의 루트 앱: argocd/apps/dev 안의 Application들을 만든다 (App of Apps)
# 설치 스크립트가 한 번 적용한다. 이후 앱 추가 · 삭제는 apps/dev에 파일을 더하거나 빼서 main에 올린다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: root-dev, namespace: argocd }
spec:
  project: default
  source:
    repoURL: git@github.com:dino-product/infra.git
    targetRevision: main
    path: argocd/apps/dev
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
