# Argo CD (chart argo/argo-cd 10.11.6, v3.5.6). 설치 · 업그레이드는 scripts/install-argocd.sh
# dev 노드 하나(4GB)라 쓰지 않는 컴포넌트는 끄고 한도를 건다
# Argo CD 자신은 Argo CD로 관리하지 않는다 (비밀번호 해시를 설치 스크립트가 SSM에서 넣는다)
global:
  domain: argocd.dev.orbi-t.com   # 공개 주소: CloudFront → Traefik (platform/edge-dev.yaml)

configs:
  params:
    server.insecure: true         # TLS는 CloudFront에서 끝난다 (원본 구간 HTTP, api와 같은 방식)
  cm:
    admin.enabled: true           # 비상용 로컬 계정 (비밀번호 /orbit/shared)
    exec.enabled: false
    # 팀원은 GitHub로 로그인한다. dino-product 조직원만 들어올 수 있다
    # clientSecret은 argocd-secret의 dex.github.clientSecret (설치 스크립트가 /orbit/shared에서 넣는다)
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: Ov23liPcuPDLbQkYEzlV   # 조직 OAuth 앱 "Orbit Argo CD (dev)" (공개해도 되는 값)
            clientSecret: $dex.github.clientSecret
            orgs:
              - name: dino-product
  rbac:
    # GitHub로 로그인한 조직원은 조회 + 앱 동기화 · 새로 고침까지 (설정 변경 · 삭제는 admin만)
    policy.default: role:team
    policy.csv: |
      p, role:team, applications, sync, */*, allow
      g, role:team, role:readonly
  # admin 비밀번호 해시와 GitHub OAuth 앱 비밀은 설치 스크립트가 --set-string으로 넣는다

notifications: { enabled: false }
applicationSet: { replicas: 0 }

controller:
  resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } }
  # 앱 동기화 · 상태 지표(argocd_app_info) → Alloy가 ServiceMonitor를 따라 긁는다 → "배포 상태 이상 (Argo CD)" 알림
  metrics:
    enabled: true
    serviceMonitor: { enabled: true, interval: 60s }
repoServer:
  # kube-prometheus-stack 렌더링(CRD 포함)이 커서 한도를 넉넉히
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 512Mi } }
server:
  resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 192Mi } }
redis:
  resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
dex:
  resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 96Mi } }
