# External Secrets Operator: Parameter Store → Secret. 다른 앱의 Secret이 이걸 쓰므로 먼저 (sync-wave -2)
# 처음엔 helm으로 설치했다. releaseName을 같게 둬서 기존 리소스를 그대로 넘겨받는다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles: [$values/platform/eso-values.yaml]
    - repoURL: git@github.com:dino-product/infra.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]   # CRD가 커서 SSA
