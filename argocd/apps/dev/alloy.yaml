# Grafana Alloy: 로그 · 지표 → Grafana Cloud
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: alloy, namespace: argocd }
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.14.0
      helm:
        releaseName: alloy
        valueFiles: [$values/platform/alloy-values.yaml]
    - repoURL: git@github.com:dino-product/infra.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
