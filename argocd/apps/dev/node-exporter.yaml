# node-exporter: 노드 CPU · 메모리 · 디스크 · 네트워크 지표 (kube-prometheus-stack에서 분리, 2026-10-28)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: node-exporter, namespace: argocd }
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 4.60.1
      helm:
        releaseName: node-exporter
        valueFiles: [$values/platform/node-exporter-values.yaml]
    - repoURL: git@github.com:dino-product/infra.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
