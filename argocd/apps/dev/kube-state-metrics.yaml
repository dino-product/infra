# kube-state-metrics: Pod · Deployment · 노드 상태 지표 (kube-prometheus-stack에서 분리, 2026-10-28)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: kube-state-metrics, namespace: argocd }
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 8.7.1
      helm:
        releaseName: kube-state-metrics
        valueFiles: [$values/platform/kube-state-metrics-values.yaml]
    - repoURL: git@github.com:dino-product/infra.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
