{{- if .Values.redisCache.enabled }}
# 캐시 전용 Redis (server HM-281 진행 보드 캐시). 로그인 · 실시간용 redis(noeviction)와 장애 범위를 나눈다
# 지워져도 되는 데이터라 디스크에 남기지 않고, 가득 차면 오래 안 쓴 키부터 지운다 (allkeys-lru)
# 서버는 이 Redis가 없거나 느려도 DB로 조회한다 → wait-redis initContainer에 넣지 않는다
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis-cache }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis-cache } }
  template:
    metadata: { labels: { app: redis-cache } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redisCache.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources: { requests: { cpu: 10m, memory: "32Mi" }, limits: { memory: 64Mi } }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }

---

apiVersion: v1
kind: Service
metadata:
  name: redis-cache
spec:
  selector: { app: redis-cache }
  ports: [{ port: 6379 }]
{{- end }}
