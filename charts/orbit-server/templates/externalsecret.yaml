apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orbit-server-env
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-parameter-store }
  target: { name: orbit-server-env, creationPolicy: Owner }
  data:
  {{- range .Values.secretKeys }}
    - secretKey: {{ . }}
      remoteRef: { key: /orbit/{{ $.Values.env }}/{{ . }} }
  {{- end }}