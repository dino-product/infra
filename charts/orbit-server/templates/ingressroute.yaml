{{- if .Values.host }}
# 원본 구간이 HTTP라 Traefik이 붙이는 X-Forwarded-Proto: http 를 https로 덮어쓴다 (앱이 리다이렉트 URL을 https로 만들도록)
# 라우트(IngressRoute)는 CloudFront 비밀 헤더 값이 들어가 Git에 둘 수 없다 → platform/edge-<env>.yaml (scripts/apply-edge.sh)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forwarded-https }
spec:
  headers:
    customRequestHeaders: { X-Forwarded-Proto: https }
{{- end }}
