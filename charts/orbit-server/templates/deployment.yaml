apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-server
  labels: { app.kubernetes.io/name: orbit-server }
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: orbit-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orbit-server }
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag" .Values.image.tag }}"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9090 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: {{ .Values.springProfile | quote }} }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError" }
            {{- range $k, $v := .Values.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: orbit-server-env }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            periodSeconds: 5
            failureThreshold: 36 # 최대 3분
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: mgmt
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            periodSeconds: 5
          lifecycle:
            preStop: { exec: { command: ["sh", "-c", "sleep 5"] } } # 엔드포인트에서 빠질 시간
