env: dev
replicas: 1
# 기본: 새 Pod가 Ready가 된 뒤 이전 Pod를 내린다 (배포 중 잠깐 2개 → 메모리 여유가 있어야 한다)
rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
image:
  repository: 714047901967.dkr.ecr.ap-northeast-2.amazonaws.com/orbit/server
  tag: "" # 환경별 values-<env>.yaml. server 레포 deploy job이 커밋으로 바꾼다 (Argo CD가 반영)
springProfile: prod
extraEnv: {}
# JVM 메모리 배분. 컨테이너 한도 안에서 힙 비율만 정한다 (한도를 올리면 노드 전체가 위험 → README "비용과 용량")
# 힙 밖(메타스페이스 · 코드 캐시 · 스레드 스택 · 버퍼)이 실측 약 200MB라 70%면 768Mi를 넘길 수 있다 → 환경별 values에서 낮춘다
javaOpts: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
resources:
  requests: { cpu: 200m, memory: 640Mi }
  # cpu 한도: 노드 2 vCPU 중 k3s · etcd · Alloy 몫(약 0.5)을 남긴다. 과부하 때 앱이 느려지는 대신 제어부가 안 죽는다
  limits: { cpu: 1500m, memory: 768Mi }
secretKeys:
  - DATABASE_URL
  - DATABASE_USERNAME
  - DATABASE_PASSWORD
  - AUTH_JWT_SECRET
  - KAKAO_ALLOWED_AUDIENCES
  - APPLE_ALLOWED_AUDIENCES
  - APPLE_TEAM_ID
  - APPLE_KEY_ID
  - APPLE_PRIVATE_KEY
  - APPLE_REFRESH_TOKEN_ENCRYPTION_KEY
  - APPLE_SERVICES_ID
  - APPLE_WEB_REDIRECT_URI
  - APPLE_WEB_RETURN_URI
  - APPLE_ANDROID_RETURN_URI
  - CORS_ALLOWED_ORIGIN_PATTERNS
# terraform이 만드는 파라미터 (/orbit/<env>/<이름>, String). put-params.sh로 넣지 않는다 → 이름이 겹치지 않게 secretKeys와 따로 둔다
#   MEDIA_*: terraform/modules/media-bucket (HM-353). 그 env의 terraform apply 전에 이 목록이 main에 올라가면
#   Argo CD가 바로 동기화해 ExternalSecret이 실패한다 (orbit-server-env는 이전 값 그대로, 앱 Degraded)
#   Secret이 바뀌어도 떠 있는 Pod의 환경 변수는 그대로 → 재시작(또는 다음 이미지 배포) 뒤에 들어간다
tfParamKeys:
  - MEDIA_BUCKET
  - MEDIA_REGION
  - MEDIA_RETENTION_MAX_DAYS
host: ""
serviceMonitor: { enabled: false }
swaggerAuth: { enabled: false }   # Swagger를 켠 환경(dev)에서 기본 인증
redis:
  persistence: false # 14단계 prod에서 true ( AOF + PVC )